name: CI

# Both long-lived branches, deliberately. Gating only dev would leave the
# dev -> main release PR — the one that actually reaches users — unchecked.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the extension is developed against. The tooling
          # conversion that follows leans on Node's native type stripping.
          node-version: '24'
          cache: npm

      # ci, not install: the lockfile pins the TypeScript major, and that pin
      # is load-bearing — 7.x breaks typescript-eslint outright.
      - run: npm ci

      - run: npm run typecheck

      # Type-aware, so it needs no build — but it needs the whole program,
      # which is why it costs about as much as the typecheck above.
      - run: npm run lint

      # Unused files, exports and dependencies. Gated rather than reported: its
      # one real finding was a dead stub, and a gate that is red on purpose is a
      # gate that gets switched off.
      - run: npm run knip

      # graph-check runs the built webview once media/preview.js becomes a
      # build artifact, so the build has to happen before the checks.
      - run: npm run build

      - run: npm run check

      # Every file the preview page loads is requested at a URL carrying a
      # version derived from that file's own bytes, so an upgrading user cannot
      # be served the previous release's code out of the webview's cache. Needs
      # the build above: half of it asserts on the copied KaTeX CSS.
      - run: npm run check:media

      # Asks vsce which files it would put in the .vsix and fails on any that
      # are not explicitly expected. .vscodeignore is a denylist and had already
      # rotted — four dev files were shipping — so this is the thing that
      # catches the next one. Needs the build above: media/ is generated.
      - run: npm run check:package

      - run: npm run test:bdd

  # The layer `verify` cannot reach at all: the extension running inside a real
  # editor. A separate job rather than a step in that one, because it downloads
  # and launches VS Code — a minute before the first assertion — while everything
  # above is seconds. The two also fail for different reasons and want different
  # reactions: above, the renderer is wrong; here, the extension does not load.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The editor download is the slow half of this job and it is identical
      # from run to run. The path is the workspace-relative one the runner uses
      # — not `~/.vscode-test`, which is where a *global* install would land and
      # would leave this caching nothing. Keyed on the config file rather than
      # on a version written here, so bumping the pinned build in
      # .vscode-test.mjs fetches the new one instead of replaying the old.
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}

      # xvfb because a GitHub runner has no display and VS Code will not start
      # without one. `test:integration` builds first: the extension under test is
      # out/extension.js, and the suite loads it through the host the way an
      # installed copy would.
      - run: xvfb-run -a npm run test:integration
